[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placebo"
version = "0.1.0"
description = "Audits AI-generated test suites and produces evidence-carrying test patches, evaluated on held-out faults."
requires-python = ">=3.11"
dependencies = ["pytest==9.0.2", "pytest-cov==7.1.0", "coverage==7.16.0"]

[project.scripts]
placebo = "placebo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: exercises real pytest subprocesses; runs a census or an audit",
]
